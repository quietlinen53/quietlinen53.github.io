<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Music Share policies</title>
  <style>
    :root { color-scheme: dark; --bg: #12110f; --card: #1c1a17; --text: #f3efe6; --muted: #b7b0a4; --line: rgba(243,239,230,.14); --accent: #e4b15a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Cantarell, Ubuntu, "Segoe UI", system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 32px)); margin: 32px auto 64px; }
    h1 { margin: 0 0 8px; font-size: 28px; font-weight: 650; }
    p, li { color: var(--muted); line-height: 1.5; }
    a { color: var(--accent); }
    section { margin-top: 22px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    code { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Music Share</h1>
      <p>Terms and privacy for a local test application. Effective 12 November 2026.</p>
    </header>
    <section>
      <p><a href="terms.html">Terms of Service</a></p>
      <p><a href="privacy.html">Privacy Policy</a></p>
    </section>
  </main>
</body>
</html>
